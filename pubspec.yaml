name: play
description: "Music guessing game: scan a QR card, hear the song in Spotify, guess the year."
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.6.0
  mobile_scanner: ^7.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/qr_years.json
    - assets/songs/
