<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Which scripts may run in the page. It holds the Spotify refresh token in
    localStorage, so an injected script is exactly what must not run here.
    Allowed, and nothing else: this site; www.gstatic.com for CanvasKit, which
    Flutter's web build loads from there; sdk.scdn.co for the Spotify player.
    'wasm-unsafe-eval' lets CanvasKit and the QR reader compile their
    WebAssembly. A new script host has to be added here, or it is blocked -
    the browser console names it.

    The policy is written by this script rather than standing as a tag,
    because older engines do not know 'wasm-unsafe-eval': they drop it and
    then refuse all WebAssembly, and the page stays black. Chromium before 97
    is what an LG TV runs (webOS 22 is Chromium 87), Safari before 16 is an
    old iPhone. Those get 'unsafe-eval' instead - the only keyword they
    accept for WebAssembly - and every newer browser keeps the strict policy.
    A meta policy only tightens, so the choice has to be made before it is
    written, and it has to stay the first script in the page.
  -->
  <script>
    (function () {
      var ua = navigator.userAgent;
      var chrome = /Chrom(?:e|ium)\/(\d+)/.exec(ua);
      var safari = !chrome && /AppleWebKit/.test(ua) &&
          (/Version\/(\d+)/.exec(ua) || /OS (\d+)_\d+(?:_\d+)? like Mac OS X/.exec(ua));
      var old = (chrome && +chrome[1] < 97) || (safari && +safari[1] < 16);
      var wasm = old ? "'unsafe-eval'" : "'wasm-unsafe-eval'";
      document.write('<meta http-equiv="Content-Security-Policy" content="' +
          "script-src 'self' " + wasm + ' https://www.gstatic.com https://sdk.scdn.co; ' +
          "object-src 'none'; base-uri 'self'" + '">');
    })();
  </script>
  <meta name="description" content="Music guessing game: scan a QR card, hear the song in Spotify, guess the year.">
  <meta name="theme-color" content="#12101A">

  <!--
    The page behind the app. Flutter paints its own view, not the document, so
    everything it does not cover shows the browser's white canvas: the moment
    before the first frame, and any strip the engine has not resized back yet.
    Same colour as `scaffoldBackgroundColor` and the manifest background.
  -->
  <style>
    html, body { background-color: #12101A; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Anno">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Anno</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    The QR reader for browsers without a BarcodeDetector, from this site rather
    than a CDN - see zxing/setup.js. The id is the one mobile_scanner looks for
    before it would load the reader itself.
  -->
  <script id="mobile-scanner-zxing-wasm" src="zxing/reader.js" defer></script>
  <script src="zxing/setup.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
